config.title: 'sol37. 2.5D 多通道深度（迁移）学习-单（多）中心-组学特征-融合-临床'
config.data_run:
  - Step1.1. 深度学习模型训练.ipynb
  - Step1.2. 特征深度学习提取.ipynb
  - Step2.1. 模型可视化-Grad-CAM.ipynb
  - Step3. 传统组学建模.ipynb
  - Step4. 传统组学+深度学习建模.ipynb
  - Step5.1. 临床基线统计分析.ipynb
  - Step5.2. Clinical.ipynb
# -------------------------- 结果汇总配置 --------------------------------#
# 需要汇总的步骤列表
config.data_summary:
  - Step6.1. 深度学习模型效能评估.ipynb
  - Step6.2 算法模型对比.ipynb
  - Step6.3 指标-Signature对比.ipynb
  - Step6.4 指标汇总-Nomogram.ipynb
# value_type: str 是默认值，所以就不写了
# tune_params：是手动设置的调参参数，后面会根据这个进行组合
# fromPreStep：表示这个参数是从上一步的输出中获取的，不需要手动设置。如果没有设置，则从 items 里面挑选一个

